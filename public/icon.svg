<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="45%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for Android 10+ and iOS home screens -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.45" />

  <!-- Andean Chakana Step Motif (Sacred Cross of the Andes) -->
  <path d="M 206 60 H 306 V 110 H 356 V 160 H 406 V 206 H 452 V 306 H 406 V 352 H 356 V 402 H 306 V 452 H 206 V 402 H 156 V 352 H 106 V 306 H 60 V 206 H 106 V 160 H 156 V 110 H 206 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round" opacity="0.88" filter="url(#glow)" />

  <!-- Inner Sacred Chakana Center Ring -->
  <circle cx="256" cy="256" r="115" fill="#0f172a" stroke="#38bdf8" stroke-width="6" opacity="0.95" />

  <!-- Chess Knight (Caballo de Ajedrez) + Flame of Knowledge (Yachay) -->
  <g transform="translate(146, 126) scale(0.9)">
    <path d="M 120 40 C 95 40 75 58 68 85 C 55 90 40 102 38 120 C 36 138 48 152 60 156 C 58 175 66 198 85 210 L 70 235 L 180 235 L 165 210 C 185 180 188 135 182 95 C 178 65 155 40 120 40 Z"
          fill="url(#goldGrad)" />
    <circle cx="85" cy="85" r="7" fill="#0f172a" />
    <circle cx="87" cy="83" r="2.5" fill="#ffffff" />
    <path d="M 145 65 L 170 85 L 148 100 L 175 125 L 152 145" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Sacred Flame in the Center of the Chakana -->
  <path d="M 256 160 C 235 200 215 220 225 250 C 235 275 256 285 256 285 C 256 285 277 275 287 250 C 297 220 277 200 256 160 Z"
        fill="url(#fireGrad)" filter="url(#glow)" opacity="0.95" />
</svg>
